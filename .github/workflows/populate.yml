name: Populate reproducibility package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/populate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download archived release
        run: |
          curl -L "https://zenodo.org/records/21860557/files/keloid-fibroblast-trajectory-v1.0.4.zip?download=1" -o /tmp/release.zip
          rm -rf /tmp/keloid-release
          mkdir -p /tmp/keloid-release
          python - <<'PY'
          import pathlib
          import shutil
          import zipfile

          archive = pathlib.Path("/tmp/release.zip")
          destination = pathlib.Path("/tmp/keloid-release")
          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  normalized = member.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(normalized).parts
                  if ".." in parts:
                      raise ValueError(f"Unsafe archive member: {member.filename}")
                  target = destination.joinpath(*parts)
                  if member.is_dir() or normalized.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with source.open(member) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
          PY
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/keloid-release/keloid-fibroblast-trajectory-1.0.4/ ./
          rm -rf /tmp/release.zip /tmp/keloid-release
      - name: Commit package
        run: |
          git config user.name "Yutong Yuan"
          git config user.email "y504071842@gmail.com"
          git add -A
          git commit -m "Release reproducibility package v1.0.4" || exit 0
          git push
