name: Populate reproducibility package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/populate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download archived release
        run: |
          curl -L "https://zenodo.org/records/21769958/files/keloid-fibroblast-trajectory-v1.0.2.zip?download=1" -o /tmp/release.zip
          rm -rf /tmp/keloid-release
          mkdir -p /tmp/keloid-release
          unzip -q /tmp/release.zip -d /tmp/keloid-release
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/keloid-release/keloid-fibroblast-trajectory-1.0.2/ ./
          rm -rf /tmp/release.zip /tmp/keloid-release
      - name: Commit package
        run: |
          git config user.name "Yutong Yuan"
          git config user.email "y504071842@gmail.com"
          git add -A
          git commit -m "Release reproducibility package v1.0.2" || exit 0
          git push
